<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" id="bizu">
  <!-- Bizu: robô de IA do @infoverins. Camadas com id para animar em JS (GSAP). -->
  <defs>
    <style>
      .ln{stroke:#18211F;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <g id="sombra"><ellipse cx="200" cy="372" rx="70" ry="10" fill="#18211F" opacity=".18"/></g>
  <g id="corpo">
    <!-- antena -->
    <g id="antena">
      <line x1="200" y1="92" x2="200" y2="52" class="ln" fill="none"/>
      <circle id="lampada" cx="200" cy="42" r="17" fill="#F2C230" class="ln"/>
      <path d="M193 36 q7 -6 14 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    </g>
    <!-- braços -->
    <path id="braco-esq" d="M112 250 q-40 10 -48 -22" fill="none" class="ln"/>
    <circle cx="62" cy="222" r="12" fill="#F2C230" class="ln"/>
    <path id="braco-dir" d="M288 250 q40 10 48 -22" fill="none" class="ln"/>
    <circle cx="338" cy="222" r="12" fill="#F2C230" class="ln"/>
    <!-- tronco -->
    <path d="M128 222 h144 q20 0 20 20 v62 q0 34 -34 34 h-116 q-34 0 -34 -34 v-62 q0 -20 20 -20z" fill="#0D6F73" class="ln"/>
    <circle cx="200" cy="282" r="18" fill="#F2C230" class="ln"/>
    <!-- cabeça / tela -->
    <rect id="cabeca" x="96" y="92" width="208" height="146" rx="40" fill="#0D6F73" class="ln"/>
    <rect id="tela" x="122" y="116" width="156" height="98" rx="26" fill="#10262A"/>
    <!-- olhos (trocar forma para expressões) -->
    <g id="olhos" fill="#FFFFFF">
      <rect id="olho-esq" x="152" y="140" width="26" height="40" rx="13"/>
      <rect id="olho-dir" x="222" y="140" width="26" height="40" rx="13"/>
    </g>
    <path id="boca" d="M184 196 q16 10 32 0" fill="none" stroke="#5CC8C3" stroke-width="6" stroke-linecap="round"/>
    <!-- orelhas -->
    <rect x="80" y="140" width="18" height="50" rx="8" fill="#F2C230" class="ln"/>
    <rect x="302" y="140" width="18" height="50" rx="8" fill="#F2C230" class="ln"/>
  </g>
</svg>
